# Publishes hpcmon on PyPI when a release is published on GitHub.
#
# The release tag must be the package version, optionally prefixed with "v"
# (e.g. v0.1.0 for __version__ = "0.1.0" in hpcmon/__init__.py).  Nothing is
# published unless all the tests pass.  PyPI is reached through "trusted
# publishing".
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml

  build:
    name: Build the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check that the release tag is the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import hpcmon; print(hpcmon.__version__)")
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::The release tag ${TAG} does not match the version ${version} of hpcmon/__init__.py"
            exit 1
          fi

      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish on PyPI
    needs: [tests, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hpcmon
    permissions:
      id-token: write  # for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
