# Runs the test suite (which requires 100% coverage) on every supported Python
# version, and once with the oldest supported versions of the dependencies.
# It runs on pushes and pull requests, and is called by the release workflow.
name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} (${{ matrix.dependencies }} dependencies)
    # Pinned: Python 3.9 builds are not provided for newer Ubuntu images.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        dependencies: [latest]
        include:
          - python-version: "3.9"
            dependencies: oldest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install hpcmon and the test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"

      - name: Install the oldest supported dependencies
        if: matrix.dependencies == 'oldest'
        run: python -m pip install "rich==12.0.0" "tomli==1.1.0"

      - name: Run the tests
        run: python -m pytest
