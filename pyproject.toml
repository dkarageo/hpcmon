[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hpcmon"
dynamic = ["version"]
description = "Monitor compute budgets, storage quotas and jobs on EuroHPC clusters (LUMI, JUPITER, Leonardo, MeluXina) from your terminal."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Dimitrios Karageorgiou" }]
keywords = ["hpc", "eurohpc", "slurm", "lumi", "jupiter", "leonardo", "meluxina", "allocation", "quota", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Clustering",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "rich>=12.0",
    "tomli>=1.1; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov>=4"]
dev = ["pytest>=7", "pytest-cov>=4", "build", "twine"]

[project.scripts]
hpcmon = "hpcmon.cli:main"

[tool.setuptools.dynamic]
version = { attr = "hpcmon.__version__" }

[tool.setuptools.packages.find]
include = ["hpcmon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=hpcmon --cov-branch --cov-report=term-missing"

[tool.coverage.run]
source = ["hpcmon"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
